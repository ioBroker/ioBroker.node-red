# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 20
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      # major updates of @types/node must follow the node.js version supported by the adapter
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
